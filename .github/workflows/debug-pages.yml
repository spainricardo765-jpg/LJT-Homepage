name: Debug Pages
on:
  workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: GET pages site
        run: |
          echo "--- GET /pages ---"
          curl -sS -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+api-version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true
      - name: POST create pages site
        run: |
          echo "--- POST /pages (workflow build type) ---"
          curl -sS -X POST -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+api-version: 2022-11-28" -d '{"build_type":"workflow"}' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true
      - name: GET pages site again
        run: |
          echo "--- GET /pages (after POST) ---"
          curl -sS -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+api-version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true
